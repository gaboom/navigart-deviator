<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deviator – saved tables</title>
<link rel="stylesheet" href="shared.css">
<link rel="icon" type="image/svg+xml" href="https://navigart.net/logo.svg">
<style>
  .app { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; }
  #list { display:flex; flex-direction:column; gap:var(--gap); overflow:auto; min-height:0; background:var(--gut); }
  .item { display:grid; grid-template-columns:minmax(0,1fr) clamp(76px,21cqw,98px); gap:var(--gap); flex:none; min-height:clamp(88px,14.5cqh,128px); }
  .card { justify-content:space-between; gap:clamp(4px,.8cqh,8px); }
  .title { font-variant-numeric:tabular-nums; font-size:clamp(16px,4.8cqw,26px); font-weight:500; line-height:1.15; word-break:break-word; }
  .side-acts { display:grid; grid-template-rows:1fr 1fr; gap:var(--gap); }
  .side-acts .t { align-items:center; justify-content:center; text-align:center; padding:4px; font-size:clamp(11px,3.1cqw,16px); font-weight:600; }

  .edit-box { gap:clamp(8px,1.4cqh,14px); flex:none; }
  .ren-in {
    font:inherit; font-size:clamp(18px,5.2cqw,28px); font-weight:400; width:100%; border:0; border-bottom:2px solid var(--fg);
    background:transparent; color:var(--fg); outline:none; padding:4px 0; -webkit-user-select:text; user-select:text; font-variant-numeric:tabular-nums;
  }
  .ex-chips { display:flex; flex-wrap:wrap; gap:var(--gap); }
  .ex-chip {
    font:inherit; border:0; background:var(--tile2); color:var(--fg); cursor:pointer;
    padding:clamp(5px,.8cqh,8px) clamp(8px,2.2cqw,14px); font-size:clamp(11px,3.1cqw,15px); font-weight:500;
  }
  .ex-chip.on { background:var(--fg); color:var(--tile); }
  .edit-acts { display:grid; grid-template-columns:1fr 1.618fr; gap:var(--gap); }
  .edit-acts .t { min-height:clamp(40px,6.2cqh,54px); align-items:center; justify-content:center; text-align:center; font-size:clamp(12px,3.4cqw,17px); font-weight:600; }
  .ts-toggle { cursor:pointer; font-variant-numeric:tabular-nums; }

  .empty { flex:1; justify-content:center; align-items:center; text-align:center; gap:8px; }
  .spacer { flex:1; min-height:0; background:var(--tile); }
  #close { justify-content:center; align-items:center; text-align:center; min-height:clamp(54px,8.5cqh,84px); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="shared.js"></script>
<script>
  const { $, link, hold, HOLD_MS, fmtDev, fmtTime, loadTables, saveTables, SAMPLE, TYPE_EXAMPLES, applyTypeExample } = Mock;
  const q = new URLSearchParams(location.search);

  let demoMode = q.has('demo') && !loadTables().length;
  let demoItems = [
    { id: 'demo-1', title: '',                                    createdAt: '2026-11-17T21:15:08Z', n: 8,  dev: SAMPLE.avg.slice() },
    { id: 'demo-2', title: 'Kittiwake · Main navigation compass', createdAt: '2026-10-09T14:22:00Z', n: 12, dev: [-1.5, 1, 3, 4.5, 4, 2.5, 0.5, -1.5, -3, -4, -4, -3] },
    { id: 'demo-3', title: 'Seagull · Hand bearing compass',      createdAt: '2026-06-02T09:10:00Z', n: 6,  dev: [-1.5, 3, 3.5, 0.5, -3.5, -4] }
  ];
  let editIdx = q.has('edit') ? +q.get('edit') : null;
  let showUtc = q.get('utc') === '1';

  const getItems = () => demoMode ? demoItems : loadTables();
  const commitItems = list => { if (demoMode) demoItems = list; else saveTables(list); };
  const maxFmt = dev => {
    if (!dev || !dev.length) return '0°';
    const best = dev.reduce((a, b) => Math.abs(b) > Math.abs(a) ? b : a, 0);
    return `max ${fmtDev(best)}`;
  };
  const openHref = t => demoMode
    ? `deviation-table.html?title=${encodeURIComponent(t.title)}&createdAt=${encodeURIComponent(t.createdAt)}&n=${t.n}`
    : `deviation-table.html?id=${encodeURIComponent(t.id)}`;

  function render() {
    const items = getItems();
    const body = !items.length
      ? `<div class="t empty"><div class="k">No saved deviation tables</div><div class="sub">Complete a compass swing to save one automatically.</div></div>`
      : items.map((t, i) => {
          const hasTitle = Boolean(t.title && t.title.trim());
          const stamp = t.createdAt || t.date;
          if (editIdx === i) {
            return `
              <div class="t edit-box">
                <div class="k">Rename · boat name &amp; compass type</div>
                <input class="ren-in" id="renIn" value="${(t.title || '').replace(/"/g, '&quot;')}" placeholder="e.g. Kittiwake · Main navigation compass" autocomplete="off" spellcheck="false">
                <div class="k">Examples · tap type to apply</div>
                <div class="ex-chips">${TYPE_EXAMPLES.map(ex => `<button type="button" class="ex-chip${(t.title || '').includes(ex) ? ' on' : ''}" data-ex="${ex}">${ex}</button>`).join('')}</div>
                <div class="edit-acts">
                  <button type="button" class="t alt" id="renCancel">CANCEL</button>
                  <button type="button" class="t acc" id="renSave">SAVE TITLE</button>
                </div>
              </div>`;
          }
          const tsTitle = `<span class="ts-toggle" title="Click to switch local +TZ / UTC Z">${fmtTime(stamp, { utc: showUtc, sec: true })}</span>`;
          const tsSub   = `<span class="ts-toggle" title="Click to switch local +TZ / UTC Z">${fmtTime(stamp, { utc: showUtc, sec: false })}</span>`;
          const displayTitle = hasTitle ? t.title : tsTitle;
          const subTxt = hasTitle ? `Tap to open · ${tsSub}` : 'Tap to open';
          return `
            <div class="item">
              <a class="t alt card" href="${openHref(t)}">
                <div class="k">${t.n} headings · ${maxFmt(t.dev)}</div>
                <div class="title">${displayTitle}</div>
                <div class="sub">${subTxt}</div>
              </a>
              <div class="side-acts">
                <button type="button" class="t ren" data-ren="${i}">RENAME</button>
                <button type="button" class="t danger del" data-del="${i}">DELETE</button>
              </div>
            </div>`;
        }).join('') + `<div class="spacer"></div>`;

    $('#app').innerHTML = `<div id="list">${body}</div><a class="t acc" id="close" href="start.html"><div class="v md">CLOSE</div></a>`;

    document.querySelectorAll('.ts-toggle').forEach(el => {
      el.onclick = e => { e.preventDefault(); e.stopPropagation(); showUtc = !showUtc; render(); };
    });
    document.querySelectorAll('[data-ren]').forEach(btn => {
      btn.onclick = () => {
        editIdx = +btn.dataset.ren;
        render();
        const inp = $('#renIn');
        if (inp) { inp.focus(); inp.select(); }
      };
    });
    document.querySelectorAll('[data-del]').forEach(btn => {
      hold(btn, HOLD_MS, () => {
        const list = getItems().slice();
        list.splice(+btn.dataset.del, 1);
        editIdx = null;
        commitItems(list);
        render();
      });
    });

    if (editIdx !== null) {
      const inp = $('#renIn');
      const saveEdit = () => {
        const list = getItems().slice();
        const nextTitle = (inp.value || '').trim();
        list[editIdx] = { ...list[editIdx], title: nextTitle };
        commitItems(list);
        editIdx = null;
        render();
      };
      $('#renCancel').onclick = () => { editIdx = null; render(); };
      $('#renSave').onclick = saveEdit;
      inp.onkeydown = e => { if (e.key === 'Enter') saveEdit(); if (e.key === 'Escape') { editIdx = null; render(); } };
      document.querySelectorAll('[data-ex]').forEach(ch => {
        ch.onclick = () => {
          inp.value = applyTypeExample(inp.value, ch.dataset.ex);
          document.querySelectorAll('[data-ex]').forEach(x => x.classList.toggle('on', inp.value.includes(x.dataset.ex)));
          inp.focus();
        };
      });
    }
  }
  render();
</script>
</body>
</html>
