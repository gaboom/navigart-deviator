<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deviator – setup</title>
<link rel="stylesheet" href="shared.css">
<link rel="icon" type="image/svg+xml" href="https://navigart.net/logo.svg">
<style>
  .app { grid-template-columns:1fr; grid-template-rows:1fr 1fr 1fr 1fr 1fr 1.618fr; }
  .t { justify-content:center; gap:1.618cqh; }
  .k { line-height:1; }
  .chips { flex-wrap:nowrap; }
  .chips .chip { flex:1 1 0; height:clamp(40px,6.8cqh,60px); min-height:0; }

  /* Tactile discrete slider: continuous 1:1 thumb tracking while dragging, snaps to the n discrete stops.
     Golden-ratio vertical split:
     - Top to number center: 38.2% (1/phi^2)
     - Number center to ruler line: 38.2% (1/phi^2) -> ruler at 76.4% (2/phi^2), equal space above & below numbers
     - Ruler line to bottom edge: 23.6% (1/phi^3) */
  #head { touch-action:none; cursor:ew-resize; }
  .dslider {
    --ruler:76.3932%;
    position:relative; height:clamp(40px,6.8cqh,60px); background:var(--tile2);
    display:grid; grid-template-columns:repeat(var(--n,8),1fr); align-items:center;
    user-select:none; overflow:hidden;
  }
  /* Horizontal rail + tick marks */
  .dslider::before {
    content:""; position:absolute; left:calc(50% / var(--n,8)); right:calc(50% / var(--n,8));
    top:var(--ruler); height:2.5px; background:var(--line); transform:translateY(-50%); pointer-events:none;
  }
  .dstop {
    position:relative; z-index:1; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    font-variant-numeric:tabular-nums; font-weight:600; color:var(--muted);
    font-size:clamp(13px,3.8cqmin,19px); pointer-events:none;
  }
  .dstop > span:first-child {
    height:var(--ruler); display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .dslider.dense .dstop { font-size:clamp(11px,3cqw,15px); }
  .dstop .tick { position:absolute; top:var(--ruler); width:2px; height:8px; background:var(--muted); opacity:.55; transform:translateY(-50%); }
  /* Sliding thumb that follows pointer 1:1 and snaps to the nearest stop */
  .dthumb {
    position:absolute; top:0; bottom:0; width:calc(100% / var(--n,8));
    left:calc(var(--pos,0) * (100% - (100% / var(--n,8))));
    background:var(--fg); color:var(--tile); z-index:2;
    display:flex; align-items:center; justify-content:center;
    font-variant-numeric:tabular-nums; font-weight:700; font-size:clamp(13px,3.8cqmin,20px);
    box-shadow:0 0 0 2px var(--tile); pointer-events:none;
    transition:left 130ms cubic-bezier(.2,.8,.2,1);
  }
  .dslider.dragging .dthumb { transition:none; }
  .dslider.dense .dthumb { font-size:clamp(11px,3cqw,16px); }

  /* Cap-height aligned directional arrows inside chips */
  .dir-lbl { display:inline-flex; align-items:baseline; justify-content:center; gap:.42em; line-height:1; }
  .dir-lbl svg { height:.71em; height:1cap; width:auto; display:block; flex:none; }

  /* Variation +/- buttons:
     - When vr > 0 (+E), '+' is .on (selected) and flashes unselected (.flash / :active) when tapped.
     - When vr < 0 (-W), '-' is .on (selected) and flashes unselected (.flash / :active) when tapped.
     - When vr === 0, neither is .on, and tapping flashes selected (.flash / :active). */
  .var-btn.on { background:var(--fg); color:var(--tile); }
  .var-btn.on:active, .var-btn.on.flash { background:var(--tile2) !important; color:var(--fg) !important; filter:none !important; }
  .var-btn:not(.on):active, .var-btn:not(.on).flash { background:var(--fg) !important; color:var(--tile) !important; filter:none !important; }

  #go { justify-content:center; gap:2.618cqh; }
  #go .sub { font-size:clamp(11px,3cqmin,15px); font-weight:600; letter-spacing:.04em; opacity:.92; line-height:1.35; font-variant-numeric:tabular-nums; }
  #go .sub .nw { white-space:nowrap; }
  .start-row { display:flex; align-items:baseline; justify-content:space-between; width:100%; font-size:clamp(54px,19.5cqw,102px); font-weight:700; letter-spacing:.03em; line-height:.75; }
  .start-row svg { width:clamp(52px,18cqw,96px); height:.71em; height:1cap; flex:none; display:block; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="shared.js"></script>
<script>
  const { $, fmt3, fmtDev, link, detectVariation } = Mock;
  const s = { n: 8, start: 0, dir: 'stbd', ref: 'M', vr: 0, geoTried: false };
  const headings = () => Array.from({ length: s.n }, (_, i) => i * 360 / s.n);
  /* When switching precision, round to the nearest available heading;
     on equal-distance ties, round down in the first half (< 180°) and round up in the second half (>= 180°). */
  function snapHeading(cur, H) {
    if (H.includes(cur)) return cur;
    let best = H[0], bestDist = Infinity;
    for (const h of H) {
      const d = Math.abs(h - cur);
      if (d < bestDist || (d === bestDist && cur >= 180 && h > best)) {
        best = h;
        bestDist = d;
      }
    }
    return best;
  }
  const chips = (arr, on, fmt, key) =>
    `<div class="chips">${arr.map(v => `<button class="chip${v === on ? ' on' : ''}" data-k="${key}" data-v="${v}">${fmt(v)}</button>`).join('')}</div>`;

  const goSubHtml = () =>
    `STEER ${fmt3(s.start)} COMPASS · MEASURE COG<br>${s.n}x · TURN ${s.dir === 'stbd' ? 'STARBOARD +' : 'PORT −'}${String(360 / s.n).padStart(2, '0')}° COMPASS`;

  function render() {
    const H = headings();
    s.start = snapHeading(s.start, H);
    const initIdx = Math.max(0, H.indexOf(s.start));
    const initPos = H.length > 1 ? initIdx / (H.length - 1) : 0;

    $('#app').innerHTML = `
      <div class="t" id="prec">
        <div class="k">Precision · measure COG</div>
        ${chips([6, 8, 12], s.n, v => v + 'x', 'n')}
      </div>
      <div class="t" id="head">
        <div class="k">Starting from · compass course</div>
        <div class="dslider${s.n >= 10 ? ' dense' : ''}" id="hslider" style="--n:${s.n};--pos:${initPos}">
          ${H.map(v => `<div class="dstop" data-v="${v}"><span>${String(v).padStart(3, '0')}</span><span class="tick"></span></div>`).join('')}
          <div class="dthumb" id="hthumb">${String(s.start).padStart(3, '0')}°</div>
        </div>
      </div>
      <div class="t" id="dir">
        <div class="k">Direction · turn to</div>
        <div class="chips">
          <button class="chip${s.dir === 'port' ? ' on' : ''}" data-k="dir" data-v="port">
            <span class="dir-lbl">
              <svg viewBox="0 0 86 100" aria-hidden="true"><polygon points="86,0 0,50 86,100" fill="currentColor"/></svg>
              <span>PORT</span>
            </span>
          </button>
          <button class="chip${s.dir === 'stbd' ? ' on' : ''}" data-k="dir" data-v="stbd">
            <span class="dir-lbl">
              <span>STARBOARD</span>
              <svg viewBox="0 0 86 100" aria-hidden="true"><polygon points="0,0 86,50 0,100" fill="currentColor"/></svg>
            </span>
          </button>
        </div>
      </div>
      <div class="t" id="refT">
        <div class="k">Course over ground · chartplotter COG GNSS °</div>
        <div class="chips">
          <button class="chip${s.ref === 'M' ? ' on' : ''}" data-k="ref" data-v="M">MAGNETIC</button>
          <button class="chip${s.ref === 'T' ? ' on' : ''}" data-k="ref" data-v="T">TRUE</button>
        </div>
      </div>
      <div class="t" id="varT" style="${s.ref === 'T' ? '' : 'opacity:.38'}">
        <div class="k">Variation</div>
        <div class="chips">
          <button class="chip var-btn${s.ref === 'T' && s.vr < 0 ? ' on' : ''}" id="vm"${s.ref === 'T' ? '' : ' disabled'}>−</button>
          <div class="chip" id="varVal" style="display:flex;align-items:center;justify-content:center;background:transparent">${s.ref === 'T' ? fmtDev(s.vr) : '—'}</div>
          <button class="chip var-btn${s.ref === 'T' && s.vr > 0 ? ' on' : ''}" id="vp"${s.ref === 'T' ? '' : ' disabled'}>+</button>
        </div>
      </div>
      <a class="t acc" id="go" href="#">
        <div class="v start-row">
          <span>START</span>
          <svg viewBox="0 0 86 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <polygon points="0,0 86,50 0,100" fill="currentColor"/>
          </svg>
        </div>
        <div class="sub" id="goSub">${goSubHtml()}</div>
      </a>`;

    document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = b.dataset.k, v = b.dataset.v;
      s[k] = k === 'n' ? +v : v;
      if (k === 'ref' && v === 'T' && !s.geoTried) {
        s.geoTried = true;
        detectVariation(vr => { s.vr = vr; render(); });
      }
      render();
    });

    /* Tactile discrete slider: thumb tracks pointer 1:1 while dragging, snaps to nearest stop on release */
    const headTile = $('#head'), hs = $('#hslider'), thumb = $('#hthumb');
    const syncGo = () => {
      thumb.textContent = String(s.start).padStart(3, '0') + '°';
      $('#goSub').innerHTML = goSubHtml();
      $('#go').href = link('measure.html', { n: s.n, start: s.start, dir: s.dir, ref: s.ref, var: s.vr, round: null });
    };
    const updateFromClientX = (clientX, snap) => {
      const r = hs.getBoundingClientRect(), seg = r.width / H.length;
      const raw = (clientX - r.left - seg / 2) / Math.max(1, r.width - seg);
      const clamped = Math.max(0, Math.min(1, raw));
      const idx = Math.round(clamped * (H.length - 1));
      s.start = H[idx];
      hs.style.setProperty('--pos', snap ? idx / (H.length - 1) : clamped);
      syncGo();
    };
    let dragging = false;
    headTile.onpointerdown = e => {
      headTile.setPointerCapture(e.pointerId);
      dragging = true;
      hs.classList.add('dragging');
      updateFromClientX(e.clientX, false);
    };
    headTile.onpointermove = e => {
      if (!dragging) return;
      updateFromClientX(e.clientX, false);
    };
    const finishDrag = e => {
      if (!dragging) return;
      dragging = false;
      hs.classList.remove('dragging');
      updateFromClientX(e.clientX, true);
    };
    headTile.onpointerup = finishDrag;
    headTile.onpointercancel = () => {
      dragging = false;
      hs.classList.remove('dragging');
      hs.style.setProperty('--pos', H.indexOf(s.start) / (H.length - 1));
    };

    if ($('#vm')) {
      const syncVar = () => {
        $('#varVal').textContent = fmtDev(s.vr);
        $('#vm').classList.toggle('on', s.vr < 0);
        $('#vp').classList.toggle('on', s.vr > 0);
        syncGo();
      };
      const pulse = (btn, delta) => {
        s.vr = Math.max(-30, Math.min(30, s.vr + delta));
        syncVar();
        btn.classList.add('flash');
        clearTimeout(btn._ft);
        btn._ft = setTimeout(() => btn.classList.remove('flash'), 120);
      };
      $('#vm').onclick = () => pulse($('#vm'), -1);
      $('#vp').onclick = () => pulse($('#vp'), 1);
    }
    syncGo();
  }
  render();
</script>
</body>
</html>
