<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deviator – start</title>
<link rel="stylesheet" href="shared.css">
<link rel="icon" type="image/svg+xml" href="https://navigart.net/logo.svg">
<style>
  .app {
    grid-template-columns:1fr 1fr;
    grid-template-rows:1.618fr 2.618fr 1fr;
    grid-template-areas:"brand brand" "start start" "saved settings";
  }
  #brand, #start { justify-content:center; gap:4cqh; }
  #brand { grid-area:brand; }
  #brand .headrow { align-items:center; }
  #brand svg { width:clamp(52px,18cqw,96px); height:auto; flex:none; display:block; }
  #start { grid-area:start; }
  #start .sub { font-size:clamp(14px,4cqmin,20px); opacity:.9; line-height:1; }
  .start-row { display:flex; align-items:baseline; justify-content:space-between; width:100%; font-size:clamp(54px,19.5cqw,102px); font-weight:700; letter-spacing:.03em; line-height:.75; }
  .start-row svg { width:clamp(52px,18cqw,96px); height:.71em; height:1cap; flex:none; display:block; }
  #saved, #settings { justify-content:center; gap:2cqh; }
  #saved { grid-area:saved; }
  #settings { grid-area:settings; }
  .headrow { display:flex; align-items:center; justify-content:space-between; gap:2cqw; }
  .headrow .k { line-height:1; }
  .ico { width:clamp(22px,6.5cqmin,34px); height:clamp(22px,6.5cqmin,34px); flex:none; opacity:.85; display:block; }
  .btn { line-height:.95; margin-bottom:-.08em; }
  .name { font-size:clamp(28px,9cqw,54px); font-weight:300; letter-spacing:.14em; line-height:.82; }
  .state { font-size:clamp(12px,3.5cqw,18px); line-height:1.45; margin-bottom:-.15em; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="t" id="brand">
    <div class="headrow">
      <div class="name">DEVIATOR</div>
      <svg viewBox="0 13 120 54" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
        <line x1="4" y1="40" x2="116" y2="40" stroke-width="1.5" opacity=".5"/>
        <path d="M4 40 C 24 6, 44 6, 60 40 S 96 74, 116 40"/>
        <circle cx="60" cy="40" r="5" fill="currentColor"/>
      </svg>
    </div>
    <div class="state">Swing your compass. Measure your deviation.<br>Save deviation table to convert any course.<br>Persist and use offline on any device.</div>
  </div>
  <a class="t acc" id="start" href="setup.html">
    <div class="v start-row">
      <span>START</span>
      <svg viewBox="0 0 86 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <polygon points="0,0 86,50 0,100" fill="currentColor"/>
      </svg>
    </div>
    <div class="sub">New measurement</div>
  </a>
  <a class="t alt" id="saved" href="saved.html">
    <div class="headrow">
      <div class="k">Open saved</div>
      <svg class="ico" viewBox="2 3 24 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="22" height="20" rx="2"/>
        <line x1="3" y1="10" x2="25" y2="10"/>
        <line x1="3" y1="16" x2="25" y2="16"/>
        <line x1="11" y1="10" x2="11" y2="24"/>
      </svg>
    </div>
    <div class="btn">Deviation table</div>
  </a>
  <a class="t alt" id="settings" href="settings.html?from=start.html">
    <div class="headrow">
      <div class="k">Settings</div>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>
    <div class="btn">Preferences</div>
  </a>
</div>
<script src="shared.js"></script>
<script>
  /* Saved tables only appear once at least one exists (starts empty). */
  const tables = Mock.loadTables();
  if (!tables.length) {
    document.getElementById('saved').remove();
    document.getElementById('app').style.gridTemplateAreas = '"brand brand" "start start" "settings settings"';
  } else {
    document.querySelector('#saved .k').textContent = `Open saved · ${tables.length}`;
  }
</script>
</body>
</html>
